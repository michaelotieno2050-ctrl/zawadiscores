<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zawadi Scores</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:system-ui;padding:16px;max-width:800px;margin:auto;background:#f8f9fa} .card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 5px #0001} input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ddd} button{background:#111;color:#fff;font-weight:700} .top{display:flex;justify-content:space-between;align-items:center} .small{font-size:13px;color:#666}</style>
</head><body>
<div class="top"><h2>🎼 Zawadi Scores</h2><div id="authBtns"></div></div>
<p class="small">Anybody can download. Only composers with an account can upload.</p>

<div id="loginBox" class="card">
<h3>Composer Login / Sign Up</h3>
<input id="email" type="email" placeholder="Composer email">
<input id="pass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="signup()" style="background:#fff;color:#111">Create Composer Account</button>
<p class="small" id="authMsg"></p>
</div>

<div id="uploadBox" class="card" style="display:none">
<h3>Upload Song - <span id="who"></span></h3>
<input id="title" placeholder="Song Title">
<input id="composer" placeholder="Composer Name">
<input id="file" type="file" accept=".pdf,.mp3,.mp4,.jpg,.png">
<button onclick="upload()">Upload Song</button>
<button onclick="logout()" style="background:#eee;color:#111">Logout</button>
<p id="msg"></p>
</div>

<h3>All Songs - Free Download For Everyone</h3>
<div id="list"></div>

<script>
const supabaseClient = supabase.createClient("YOUR_SUPABASE_URL","YOUR_SUPABASE_ANON_KEY");

async function checkUser(){
  const {data:{user}} = await supabaseClient.auth.getUser();
  if(user){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('uploadBox').style.display='block';
    document.getElementById('who').innerText = user.email;
    document.getElementById('authBtns').innerHTML = `<span class="small">${user.email}</span>`;
  } else {
    document.getElementById('loginBox').style.display='block';
    document.getElementById('uploadBox').style.display='none';
    document.getElementById('authBtns').innerHTML = `<span class="small">Not logged in - Viewing as Guest</span>`;
  }
}
async function signup(){
  const email=document.getElementById('email').value, password=document.getElementById('pass').value;
  const {error} = await supabaseClient.auth.signUp({email,password});
  document.getElementById('authMsg').innerText = error ? error.message : "Account created! Now tap Login.";
}
async function login(){
  const email=document.getElementById('email').value, password=document.getElementById('pass').value;
  const {error} = await supabaseClient.auth.signInWithPassword({email,password});
  if(error) document.getElementById('authMsg').innerText = error.message;
  else checkUser();
}
async function logout(){ await supabaseClient.auth.signOut(); checkUser(); }

async function upload(){
  const title=document.getElementById('title').value;
  const composer=document.getElementById('composer').value;
  const file=document.getElementById('file').files[0];
  if(!title||!file) return alert("Add title + file");
  document.getElementById('msg').innerText="Uploading...";
  const path = Date.now()+"_"+file.name;
  const {error:upErr} = await supabaseClient.storage.from('scores').upload(path, file);
  if(upErr) return document.getElementById('msg').innerText = upErr.message;
  const {data} = supabaseClient.storage.from('scores').getPublicUrl(path);
  const {error} = await supabaseClient.from('songs').insert([{title, composer, file_url:data.publicUrl, file_name:file.name}]);
  document.getElementById('msg').innerText = error ? error.message : "✅ Uploaded!";
  if(!error) loadSongs();
}
async function loadSongs(){
  const {data} = await supabaseClient.from('songs').select('*').order('created_at',{ascending:false});
  document.getElementById('list').innerHTML = (data||[]).map(s=>`
    <div class="card"><b>${s.title}</b><br><span class="small">By ${s.composer||'Unknown'} • ${s.composer_email||''}</span><br><br>
    <a href="${s.file_url}" target="_blank" download><button>⬇️ Download</button></a></div>`).join('') || "No songs yet";
}
checkUser(); loadSongs();
</script></body></html>
